pluginManagement {
    repositories {
        maven { url = "https://bmclapi2.bangbang93.com/maven/" }
        maven { url = "https://maven.aliyun.com/repository/public/" }
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://jitpack.io/" }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "net.minecraftforge.gradle.forge") {
                useModule("com.github.ccbluex:ForgeGradle:a3d86a59c0")
            }
        }
    }
}

rootProject.name = "AntiAXE-AAOnly"
